# Generated by the public release publisher. Source snapshots originate in GitLab.
name: Public source checks and crates.io release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    container: rust:${{ matrix.rust }}-bookworm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.89', '1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
          rustup component add rustfmt clippy
      - run: python3 scripts/check.py
      - run: python3 scripts/check_package.py
  publish:
    name: Publish crates.io package
    if: vars.CRATES_RELEASE_ENABLED == 'true' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: source
    runs-on: ubuntu-latest
    container: rust:1.89-bookworm
    timeout-minutes: 25
    environment:
      name: crates-io
      url: https://crates.io/crates/basaltic-sdk-rust
    concurrency:
      group: crates-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install package tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
      - name: Verify source crate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_package.py
          git diff --exit-code
      - name: Authenticate with trusted publishing
        if: vars.CRATES_BOOTSTRAP != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish from the public tag
        env:
          # crates.io requires a one-time token for the initial publication.
          # Remove it and disable bootstrap immediately after configuring OIDC.
          CARGO_REGISTRY_TOKEN: ${{ vars.CRATES_BOOTSTRAP == 'true' && secrets.CRATES_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --locked
